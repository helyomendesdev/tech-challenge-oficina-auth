[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "oficina-auth"
version = "0.1.0"
description = "Serverless authentication contract for Tech Challenge Oficina."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Tech Challenge Oficina" }
]
dependencies = [
  "PyJWT[crypto]>=2.10,<3"
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "PyYAML>=6.0.2,<7",
  "ruff>=0.8,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/oficina_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["oficina_auth"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
